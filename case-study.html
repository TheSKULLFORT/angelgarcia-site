<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Angel Garcia, Creative Director">
<meta property="og:description" content="Brand and marketing creative for games, tech and entertainment.">
<meta property="og:type" content="website">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Case study · Angel Garcia</title>
<meta name="description" content="Angel Garcia, creative director for brand and marketing in gaming, tech and entertainment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
/* Layout: a gig-poster hero. A hairline spec header, then the handheld floating in a soft studio spotlight over giant cropped type, with metadata and credits in the corners and a print grain over everything. An acid band carries the translucent cartridge shelf. Below, back-of-box tables for credits, capabilities and contact. */
:root{
  --ground:#c3c5c4; --panel:#d5d6d5; --alloy-300:#a7a9a8; --line:#8e9190; --rule:#0e0f10;
  --ink:#0e0f10; --ink-muted:#3a3d3e; --poster:#0e0f10;
  --signal:#ff4d00; --signal-text:#8f2a00; --acid:#b3ff00; --on-acid:#0e0f10; --os-blue:#1f24ff;
  --graphite:#1c1d1f; --screen-ink:#ffffff; --focus:#ff4d00; --floor:20,22,24; --spot:#dcdedd; --grain-blend:multiply; --grain-op:.07;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font-pixel:"Silkscreen","JetBrains Mono",ui-monospace,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b0c0d; --panel:#17181a; --alloy-300:#2a2c2f; --line:#3a3d40; --rule:#e8e9e8;
  --ink:#eff0ef; --ink-muted:#a4a7a8; --poster:#eff0ef; --signal-text:#ff6a2a; --graphite:#232427; --floor:0,0,0; --spot:#1e2023; --grain-blend:screen; --grain-op:.06; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0b0c0d; --panel:#17181a; --alloy-300:#2a2c2f; --line:#3a3d40; --rule:#e8e9e8;
  --ink:#eff0ef; --ink-muted:#a4a7a8; --poster:#eff0ef; --signal-text:#ff6a2a; --graphite:#232427; --floor:0,0,0; --spot:#1e2023; --grain-blend:screen; --grain-op:.06; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font-display);font-size:15px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.5;color:var(--ink-muted)}
.meta b{font-weight:500;color:var(--ink)}
.px{font-family:var(--font-pixel);font-weight:400;letter-spacing:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* spec header */
.head{display:grid;grid-template-columns:1fr auto;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:var(--space-6)}
.head > *{padding:var(--space-4) var(--space-6);display:flex;align-items:center;gap:var(--space-4);min-width:0}
.head > * + *{border-left:1px solid var(--rule)}
.head .who{padding-left:0;text-decoration:none}
.head .who .mark{flex:none;width:44px;height:44px;border-radius:50%;display:block}
.head .who span{font-size:clamp(18px,2vw,26px);line-height:1.05;font-weight:500}
.head nav{display:grid;grid-template-columns:auto auto;gap:2px var(--space-6);padding-right:0}
.head nav a{text-decoration:none;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.head nav a:hover{color:var(--ink)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;min-height:clamp(600px,84vh,880px);padding-block:var(--space-6)}
.bg{position:absolute;inset:0;container-type:inline-size;overflow:hidden;background:radial-gradient(ellipse 36% 50% at 50% 52%, var(--spot) 0%, transparent 100%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);background-size:180px 180px}
.poster{position:absolute;left:0;right:0;top:55%;transform:translateY(-50%);text-align:center;color:var(--poster);pointer-events:none;user-select:none}
.poster span{display:block;font-weight:800;font-stretch:100%;font-size:17cqw;line-height:.8;letter-spacing:-.045em;white-space:nowrap;text-transform:uppercase}
.poster span:nth-child(2){transform:translateX(6cqw)}
.poster.swap span{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.poster.swap span:nth-child(2){animation-delay:.06s}
@keyframes rise{from{clip-path:inset(0 0 100% 0);transform:translateY(12%)}to{clip-path:inset(0 0 0 0)}}
.poster.swap span:nth-child(2){animation-name:rise2}
@keyframes rise2{from{clip-path:inset(0 0 100% 0);transform:translate(6cqw,12%)}to{clip-path:inset(0 0 0 0);transform:translateX(6cqw)}}
#stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab;user-select:none}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.ov{position:relative;z-index:2;pointer-events:none;min-width:0}
.ov a,.ov button{pointer-events:auto}
.tl{grid-column:1;grid-row:1;max-width:300px}
.tl p{font-size:15px;line-height:1.45;margin:var(--space-3) 0 0;color:var(--ink)}
.tr{grid-column:2;grid-row:1;justify-self:end;text-align:left;width:220px}
.credits{margin:0;display:flex;flex-direction:column;gap:var(--space-3)}
.credits dt{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.credits dd{margin:0;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);line-height:1.35}
.bl{grid-column:1;grid-row:3;align-self:end;max-width:380px}
.cartno{font-weight:800;font-size:clamp(44px,4.6vw,68px);line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums;text-transform:uppercase;margin:0}
.cartsub{font-size:20px;font-weight:600;line-height:1.15;margin:var(--space-2) 0 0}
.bl p.sum{margin:var(--space-3) 0 0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.br{grid-column:2;grid-row:3;justify-self:end;align-self:end;text-align:right}
.led{display:inline-flex;align-items:center;gap:var(--space-2)}
.led::before{content:"";width:18px;height:3px;background:var(--alloy-300)}
.led.on::before{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.btns{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.btn{appearance:none;cursor:pointer;font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  display:inline-flex;align-items:center;gap:var(--space-2);padding:10px var(--space-4);border:1.5px solid var(--rule);background:transparent;color:var(--ink)}
.btn.solid{background:var(--rule);color:var(--ground)}
.btn:hover{background:var(--rule);color:var(--ground)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#0e0f10}

/* acid band + shelf */
.band{background:var(--acid);color:var(--on-acid)}
.band .wrap{display:grid;grid-template-columns:auto 1fr;gap:var(--space-8);align-items:center;padding-block:var(--space-6)}
.band .ins{font-weight:800;font-size:34px;line-height:.86;letter-spacing:-.03em;text-transform:uppercase;margin:0}
.band .meta{color:var(--on-acid);margin-top:var(--space-3)}
.band kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--on-acid);padding:0 4px}
.shelf{list-style:none;margin:0;padding:var(--space-4) var(--space-1) var(--space-2);display:flex;gap:var(--space-3);overflow-x:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--on-acid) transparent}
.cart{--ed:#e8eef0;--edtx:#0e0f10;appearance:none;cursor:pointer;flex:none;width:104px;height:133px;position:relative;text-align:left;
  background:color-mix(in srgb, var(--ed) 80%, transparent);border:1.5px solid #0e0f10;border-radius:5px;clip-path:polygon(0 0,100% 0,100% 100%,20px 100%,0 calc(100% - 20px));
  padding:var(--space-2);display:flex;flex-direction:column;justify-content:space-between;color:var(--edtx);
  transition:transform .2s cubic-bezier(.2,.8,.2,1);font-family:var(--font-display);overflow:hidden}
.cart::before{content:"";position:absolute;left:14px;right:14px;top:44px;bottom:10px;border-radius:3px;background:rgba(14,15,16,.16);border:1px dashed rgba(14,15,16,.25)}
.cart::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.5) 0 18%,transparent 34%);pointer-events:none}
.cart .no{position:relative;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em}
.cart .nm{position:relative;font-weight:700;font-size:13px;line-height:1.05}
.cart .ed{position:relative;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.cart:hover{transform:translateY(-5px)}
.cart[aria-current="true"]{transform:translateY(-10px);box-shadow:0 3px 0 #0e0f10}
.cart.in{opacity:.35}

/* sections */
section.box{padding-block:var(--space-16) 0}
.box-head{display:grid;grid-template-columns:200px 1fr auto;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule)}
.box-head > *{padding:var(--space-3) var(--space-4);display:flex;align-items:center}
.box-head > *:first-child{padding-left:0}
.box-head > * + *{border-left:1px solid var(--rule)}
.box-head h3{margin:0;font-size:clamp(24px,2.6vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1}
.box-head .n{font-weight:800;font-size:clamp(28px,3vw,44px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.index{list-style:none;margin:0;padding:0}
.index li{display:grid;grid-template-columns:200px 1.1fr 1.4fr 1fr auto auto;gap:var(--space-6);align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding .25s cubic-bezier(.16,1,.3,1)}
.index li:hover{padding-left:var(--space-3)}
.index .c{font-weight:600;font-size:20px;letter-spacing:-.015em;line-height:1.15}
.index .p{font-size:15px;line-height:1.35}
.index .r{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.index .sw{display:inline-flex;align-items:center;gap:var(--space-2)}
.index .sw i{width:10px;height:14px;border-radius:3px 3px 1px 1px;box-shadow:inset 0 0 0 1px rgba(14,15,16,.6)}
.index .go{appearance:none;border:1px solid var(--rule);background:none;color:var(--ink);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.index .go:hover{background:var(--rule);color:var(--ground)}
@media (max-width:1000px){ .index li{grid-template-columns:auto 1fr auto auto} .index .sw span,.index .r{display:none} .index .p{grid-column:2;grid-row:2;font-size:14px;color:var(--ink-muted)} .index .c{grid-column:2} .index .go{grid-row:1 / span 2} }
@media (prefers-reduced-motion: reduce){ .index li{transition:none} }
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 var(--space-8);margin:0;padding:0;list-style:none}
.titles li{display:grid;grid-template-columns:3ch 1fr auto;gap:var(--space-3);padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:baseline;min-width:0}
.titles .i{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.titles .s{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);text-align:right}
.about{display:grid;grid-template-columns:200px 1fr;gap:var(--space-8);padding-top:var(--space-8)}
.about p.lead{font-size:20px;line-height:1.45;margin:0 0 var(--space-8);max-width:58ch;font-weight:500}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-8)}
.caps ul{list-style:none;margin:var(--space-3) 0 0;padding:0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:var(--space-3)}
.press{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-8);margin-top:var(--space-3);font-weight:800;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.02em;text-transform:uppercase;line-height:1.05}
.contact{overflow:hidden;padding-block:var(--space-12) var(--space-8)}
.contact .big{font-weight:800;font-size:clamp(64px,13vw,200px);line-height:.82;letter-spacing:-.045em;text-transform:uppercase;margin:0;white-space:nowrap}
.contact .big span{display:block}
.contact .big span:nth-child(2){padding-left:8vw}
.contact-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--space-8);margin-top:var(--space-8);border-top:1px solid var(--rule);padding-top:var(--space-4)}
.links{display:flex;flex-direction:column;gap:4px}
.links a{font-family:var(--font-mono);font-size:12.5px;text-decoration:none;color:var(--ink)}
.links a:hover{color:var(--signal-text)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-4);padding-block:var(--space-6) var(--space-12);border-top:3px solid var(--rule)}

@media (max-width: 860px){
  .head{grid-template-columns:1fr auto}
  .head nav{display:none}
  .hero{display:flex;flex-direction:column;min-height:0;padding-block:var(--space-6) 0}
  .bg{position:relative;inset:auto;height:min(108vw,560px);order:2;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
  .poster span{font-size:24cqw}
  .tl{order:1;max-width:none}
  .tr,.bl,.br{order:3;width:auto;justify-self:auto;align-self:auto;text-align:left;max-width:none}
  .bl{order:3;margin-top:var(--space-4)}
  .tr{order:4;margin-top:var(--space-6)}
  .br{order:5;margin-block:var(--space-6)}
  .credits{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
  .band .wrap{grid-template-columns:1fr;gap:0}
  .box-head{grid-template-columns:1fr auto}
  .box-head > .lbl{display:none}
  .box-head > *:nth-child(2){padding-left:0;border-left:0}
  .about{grid-template-columns:1fr}
  .about > .meta{display:none}
}
@media (prefers-reduced-motion: reduce){ .cart{transition:none} .poster.swap span{animation:none} }
</style>
<style>
/* Case study: breadcrumb, poster hero with the project's cartridge as the object, overview, media, story, next cartridge. */
.crumb{display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-top:var(--space-4)}
.crumb a{text-decoration:none}
.cs-hero{position:relative;min-height:clamp(600px,72vh,760px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;padding-block:var(--space-6)}
.cs-hero .bg{position:absolute;inset:0;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));container-type:inline-size;overflow:hidden;background:radial-gradient(ellipse 34% 50% at 50% 52%, var(--spot) 0%, transparent 100%)}
.cs-hero .poster{top:62%}
.cs-hero .tl .cartno{font-size:clamp(44px,4.6vw,68px);line-height:.9;margin:0}
.cs-hero .tl .cartsub{font-size:20px;margin-top:var(--space-2)}
#story{padding-bottom:var(--space-16)}
#overview{padding-bottom:0}
.cs-hero .tl{grid-column:1;grid-row:1}
.cs-hero .tr{grid-column:2;grid-row:1}
.cs-hero .br{grid-column:2;grid-row:3}
.hero-cart{position:absolute;left:50%;top:50%;width:104px;height:133px;transform:translate(-50%,-46%) rotate(-6deg) scale(2.5);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(14,15,16,.25))}
.hero-cart.cart:hover{transform:translate(-50%,-46%) rotate(-6deg) scale(2.5)}
.cs-lead{font-size:clamp(22px,2.4vw,32px);line-height:1.3;letter-spacing:-.02em;font-weight:500;margin:0;max-width:30ch;text-wrap:pretty}
.cs-media{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);padding-top:var(--space-12)}
.cs-media figure{margin:0;grid-column:1 / -1;min-width:0}
.cs-media figure.half{grid-column:auto}
.cs-media img,.cs-media video,.cs-media iframe{display:block;width:100%;height:auto;background:var(--panel);border:0}
.cs-media .embed{position:relative;aspect-ratio:16/9;background:var(--panel)}
.cs-media .embed iframe{position:absolute;inset:0;width:100%;height:100%}
.cs-media figcaption{margin-top:var(--space-2)}
.story{display:grid;grid-template-columns:220px repeat(3,minmax(0,1fr));gap:var(--space-8);padding-top:var(--space-8)}
.story p{margin:var(--space-3) 0 0;max-width:44ch}
.next .wrap{display:grid;grid-template-columns:214px auto 1fr auto;gap:var(--space-8);align-items:center;padding-block:var(--space-8)}
.next h3{font-weight:800;font-size:30px;line-height:.88;letter-spacing:-.035em;text-transform:uppercase;margin:0}
.next .client{font-weight:800;font-size:clamp(36px,4vw,56px);letter-spacing:-.04em;line-height:1;margin:6px 0}
.next a.cart{text-decoration:none}
.next .meta{color:var(--on-acid)}
.missing{padding:var(--space-16) 0;text-align:center}
@media (max-width:860px){
  .cs-hero{display:flex;flex-direction:column;min-height:0}
  .cs-hero .bg{position:relative;inset:auto;height:min(100vw,460px);order:2}
  .cs-hero .poster span{font-size:23cqw}
  .hero-cart{transform:translate(-50%,-46%) rotate(-6deg) scale(1.8)}
  .cs-hero .tl{order:1}.cs-hero .tr{order:3;width:auto;margin-top:var(--space-6)}.cs-hero .br{order:4;text-align:left;justify-self:auto;margin-top:var(--space-4)}
  .cs-media{grid-template-columns:1fr}.cs-media figure.half{grid-column:1 / -1}
  .story{grid-template-columns:1fr}.story > .meta:first-child{display:none}
  .next .wrap{grid-template-columns:1fr auto;gap:var(--space-4)}
  .next .wrap > :first-child{grid-column:1 / -1}
}
</style>
</head>
<body>
<div class="grain" id="grain" aria-hidden="true"></div>
<div class="wrap">

<script type="module">
const ED={acid:{name:"Acid",hex:"#b3ff00",tx:"#0e0f10"},blaze:{name:"Blaze",hex:"#ff4d00",tx:"#0e0f10"},blue:{name:"System Blue",hex:"#1f24ff",tx:"#ffffff"},clear:{name:"Clear",hex:"#e8eef0",tx:"#0e0f10"},smoke:{name:"Smoke",hex:"#3a3d42",tx:"#ffffff"}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'); const $=id=>document.getElementById(id);
(function(){ try{ const c=document.createElement('canvas'); c.width=c.height=180; const g=c.getContext('2d'); const d=g.createImageData(180,180);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; } g.putImageData(d,0,0); $('grain').style.backgroundImage=`url(${c.toDataURL()})`; }catch(e){} })();
const [ALL, SITE] = await Promise.all(['/content/projects.json','/content/site.json'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>r.json())));
const P=ALL.filter(p=>p.published!==false);
const slug=(location.pathname.match(/\/work\/([^\/?#]+)/)||[])[1] || new URLSearchParams(location.search).get('p');
const i=P.findIndex(p=>p.slug===slug);
$('fplace').textContent=SITE.place||'Los Angeles, CA';
if(i<0){ $('main').innerHTML='<div class="missing"><p class="cartno">NO CART</p><p class="cartsub">That project isn\'t on the shelf.</p><div class="btns" style="justify-content:center"><a class="btn solid" href="/#index">See all work</a></div></div>'; $('next').remove(); }
else {
  const p=P[i], e=ED[p.edition]||ED.clear, n=pad(i+1);
  document.title=`${p.client} · ${p.title} · Angel Garcia`;
  $('pos').textContent=`Case study · ${n} / ${pad(P.length)} · ${e.name} edition`;
  $('poster').innerHTML=[p.poster_line_1||p.client,p.poster_line_2||''].map(l=>`<span>${esc(l)}</span>`).join('');
  const cartHTML=(c,num)=>{ const ce=ED[c.edition]||ED.clear; return {style:`--ed:${ce.hex};--edtx:${ce.tx}`, inner:`<span class="no">CART/${num}</span><span class="nm">${esc(c.cartridge_label||c.client)}</span><span class="ed">${ce.name} ed.</span>`}; };
  const hc=cartHTML(p,n); $('heroCart').setAttribute('style',hc.style); $('heroCart').innerHTML=hc.inner;
  $('cartno').textContent='CART/'+n; $('ptitle').textContent=p.title;
  const facts=[['Client',p.client],...(p.facts||[]).map(f=>[f.label,f.value])]; if(p.year) facts.push(['Year',p.year]);
  $('credits').innerHTML=facts.slice(0,4).map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('');
  $('ohead').textContent=p.title; $('onum').textContent=n; $('lead').textContent=p.summary;
  if(p.link) $('extlink').innerHTML=`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">See it live</a>`;
  const embed=u=>{ let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/); if(m) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
    m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/); if(m) return `https://player.vimeo.com/video/${m[1]}`; return null; };
  const items=[]; if(p.cover) items.push({type:'image',file:p.cover,caption:'',size:'full'}); (p.media||[]).forEach(m=>items.push(m));
  $('media').innerHTML=items.map(m=>{ const cls=m.size==='half'?' class="half"':''; const cap=m.caption?`<figcaption class="meta">${esc(m.caption)}</figcaption>`:'';
    if(m.type==='video' && m.file) return `<figure${cls}><video src="${esc(m.file)}" autoplay muted loop playsinline controls preload="metadata"></video>${cap}</figure>`;
    if((m.type==='embed'||m.type==='video') && m.url){ const src=embed(m.url); return src?`<figure${cls}><div class="embed"><iframe src="${src}" title="${esc(m.caption||p.title)}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>${cap}</figure>`:`<figure${cls}><a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">Watch the video</a>${cap}</figure>`; }
    if(m.file) return `<figure${cls}><img src="${esc(m.file)}" alt="${esc(m.caption||p.title)}" loading="lazy">${cap}</figure>`; return ''; }).join('');
  const story=[['Challenge',p.challenge],['Idea',p.idea],['Result',p.result]].filter(s=>s[1]);
  if(story.length){ $('story').hidden=false; $('snum').textContent=story.length; $('storybody').innerHTML='<div class="meta"></div>'+story.map(s=>`<div><span class="meta">${s[0]}</span><p>${esc(s[1])}</p></div>`).join(''); }
  const q=P[(i+1)%P.length], qn=pad((i+1)%P.length+1), qc=cartHTML(q,qn), qe=ED[q.edition]||ED.clear;
  $('next').innerHTML=`<div class="wrap"><h3>Next<br>cartridge</h3><a class="cart" href="/work/${esc(q.slug)}" style="${qc.style}" aria-label="Next: ${esc(q.client)}">${qc.inner}</a><div><span class="meta">${qn} / ${pad(P.length)} &middot; ${qe.name} edition</span><p class="client">${esc(q.client)}</p><span>${esc(q.title)}</span></div><a class="btn solid" href="/work/${esc(q.slug)}">Load next</a></div>`;
}
</script>
